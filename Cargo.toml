[package]
name = "gdu-diff"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clipboard-rs = "0.3.4"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs-next = "2.0"
futures-util = "0.3"
ratatui = "0.30.0"
serde = "1.0"
serde_json = { version = "1.0", features = ["unbounded_depth"] }
tempfile = "3.14"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
zstd = "0.13.3"
