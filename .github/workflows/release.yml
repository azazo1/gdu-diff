name: release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag, 留空时只构建并上传 artifact"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.release_context.outputs.is_release }}
      tag_name: ${{ steps.release_context.outputs.tag_name }}
      source_ref: ${{ steps.release_context.outputs.source_ref }}
      version: ${{ steps.release_version.outputs.version }}
      package_version: ${{ steps.package_version.outputs.package_version }}
    steps:
      - name: 解析发布上下文
        id: release_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          is_release=false
          tag_name=""
          source_ref="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "push" && "$CURRENT_REF" == refs/tags/* ]]; then
            is_release=true
            tag_name="$CURRENT_REF_NAME"
            source_ref="$CURRENT_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            git check-ref-format "refs/tags/$DISPATCH_TAG"
            is_release=true
            tag_name="$DISPATCH_TAG"
            source_ref="refs/tags/$DISPATCH_TAG"
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release_context.outputs.source_ref }}

      - name: 读取包版本
        id: package_version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "gdu-diff") | .version'
          )"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: 校验发布版本
        id: release_version
        if: steps.release_context.outputs.is_release == 'true'
        env:
          TAG_NAME: ${{ steps.release_context.outputs.tag_name }}
          PACKAGE_VERSION: ${{ steps.package_version.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v$PACKAGE_VERSION"
          if [[ "$TAG_NAME" != "$expected_tag" ]]; then
            echo "tag $TAG_NAME 与包版本 $PACKAGE_VERSION 不一致" >&2
            exit 1
          fi
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x86_64
            runner: ubuntu-24.04
            binary: gdu-diff
            archive_ext: tar.gz
            format: ELF
          - platform: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            binary: gdu-diff
            archive_ext: tar.gz
            format: ELF
          - platform: windows
            arch: x86_64
            runner: windows-2025
            binary: gdu-diff.exe
            archive_ext: zip
            format: PE
          - platform: windows
            arch: aarch64
            runner: windows-11-arm
            binary: gdu-diff.exe
            archive_ext: zip
            format: PE
          - platform: macos
            arch: x86_64
            runner: macos-15-intel
            binary: gdu-diff
            archive_ext: tar.gz
            format: Mach-O
          - platform: macos
            arch: aarch64
            runner: macos-15
            binary: gdu-diff
            archive_ext: tar.gz
            format: Mach-O
    env:
      ARTIFACT: gdu-diff-${{ needs.version.outputs.package_version }}-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.archive_ext }}
    steps:
      - name: 检出目标提交
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}

      - name: 设置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 启用构建缓存
        uses: swatinem/rust-cache@v2

      - name: 构建 release 二进制
        run: cargo build --release --locked

      - name: 版本 smoke test (Unix)
        if: matrix.platform != 'windows' && (github.event_name == 'workflow_dispatch' || needs.version.outputs.is_release == 'true')
        shell: bash
        run: |
          set -euo pipefail
          version_output="$(./target/release/gdu-diff --version)"
          echo "$version_output"
          [[ "$version_output" =~ ^gdu-diff\ [^[:space:]]+$ ]]

      - name: 版本 smoke test (Windows)
        if: matrix.platform == 'windows' && (github.event_name == 'workflow_dispatch' || needs.version.outputs.is_release == 'true')
        shell: pwsh
        run: |
          $version_output = (& .\target\release\gdu-diff.exe --version) -join ' '
          Write-Output $version_output
          if ($version_output -notmatch '^gdu-diff\s+\S+$') {
            throw "unexpected version output: $version_output"
          }

      - name: 校验 Unix 二进制格式
        if: matrix.platform != 'windows' && (github.event_name == 'workflow_dispatch' || needs.version.outputs.is_release == 'true')
        shell: bash
        run: |
          set -euo pipefail
          binary="target/release/${{ matrix.binary }}"
          test -x "$binary"
          file "$binary" | grep -q '${{ matrix.format }}'

      - name: 校验 Windows 二进制格式
        if: matrix.platform == 'windows' && (github.event_name == 'workflow_dispatch' || needs.version.outputs.is_release == 'true')
        shell: pwsh
        run: |
          $binary = "target/release/${{ matrix.binary }}"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "缺少 Windows 二进制文件: $binary"
          }
          $header = [System.IO.File]::ReadAllBytes((Resolve-Path -LiteralPath $binary))
          if ($header.Length -lt 2 -or $header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
            throw "PE 文件头无效: $binary"
          }

      - name: 打包 tar.gz 归档
        if: matrix.archive_ext == 'tar.gz' && (github.event_name == 'workflow_dispatch' || needs.version.outputs.is_release == 'true')
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$ARTIFACT" -C target/release "${{ matrix.binary }}"

      - name: 打包 zip 归档
        if: matrix.archive_ext == 'zip' && (github.event_name == 'workflow_dispatch' || needs.version.outputs.is_release == 'true')
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath "target/release/${{ matrix.binary }}" -DestinationPath $env:ARTIFACT

      - name: 上传构建产物
        if: ${{ github.event_name == 'workflow_dispatch' || needs.version.outputs.is_release == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: gdu-diff-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.ARTIFACT }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: needs.version.outputs.is_release == 'true'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出发布 tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: 重新获取 annotated tag object
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: 校验 tag annotation
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          if [[ ! -s "$manual_notes" ]]; then
            echo "缺少 release notes: $manual_notes" >&2
            exit 1
          fi
          tag_ref="refs/tags/$TAG_NAME"
          tag_type="$(git cat-file -t "$tag_ref")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "发布 tag 必须是 annotated tag: $TAG_NAME" >&2
            exit 1
          fi
          git cat-file tag "$tag_ref" | sed '1,/^$/d' > tag-notes.md
          if ! grep -q '[^[:space:]]' tag-notes.md; then
            echo "发布 tag 的 annotation 不能为空: $TAG_NAME" >&2
            exit 1
          fi
          if ! cmp -s "$manual_notes" tag-notes.md; then
            echo "发布 tag 的 annotation 与 $manual_notes 不一致" >&2
            diff -u "$manual_notes" tag-notes.md || true
            exit 1
          fi

      - name: 生成 release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          base_tag_file="docs/changelog/$VERSION-base.txt"
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG_NAME"
          )
          target_sha="$(git rev-parse HEAD)"
          api_args+=(-f "target_commitish=$target_sha")
          if [[ -s "$base_tag_file" ]]; then
            base_tag="$(<"$base_tag_file")"
            git check-ref-format "refs/tags/$base_tag"
            api_args+=(-f "previous_tag_name=$base_tag")
          fi
          gh api "${api_args[@]}" --jq '.body' > generated-notes.md
          cp "$manual_notes" release-notes.md
          if [[ -s generated-notes.md ]]; then
            printf '\n\n' >> release-notes.md
            cat generated-notes.md >> release-notes.md
          fi

      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: gdu-diff-*
          path: release-artifacts
          merge-multiple: true

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-artifacts
          archives=(gdu-diff-*.tar.gz gdu-diff-*.zip)
          if (( ${#archives[@]} != 6 )); then
            echo "预期 6 个归档, 实际找到 ${#archives[@]} 个" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-artifacts/gdu-diff-*.tar.gz
            release-artifacts/gdu-diff-*.zip
            release-artifacts/SHA256SUMS
          )
          if (( ${#assets[@]} != 7 )); then
            echo "预期 7 个发布文件, 实际找到 ${#assets[@]} 个" >&2
            exit 1
          fi
          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --title "gdu-diff v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "gdu-diff v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
